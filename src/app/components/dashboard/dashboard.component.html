<div class="flex flex-col items-center justify-center mt-32 text-center gap-6 px-4">
  <h1 class="text-5xl font-extrabold text-slate-800 tracking-tight">
    Welcome to <span class="text-emerald-400">TodoList</span>
  </h1>

  <p class="text-lg text-slate-500 max-w-lg">
    Manage your daily workflow efficiently. A fast, reactive, and memory-light to-do list built with modern Angular.
  </p>

  <div class="flex flex-row gap-5">
    <a mat-fab extended routerLink="/register" (click)="trackCta()">
      <mat-icon>person_add</mat-icon>
      Start now
    </a>
    <a mat-fab extended routerLink="/add-todo">
      <mat-icon>list</mat-icon>
      Go to your tasks
    </a>
  </div>
</div>
