<div class="flex justify-end gap-2">
  @for (filter of filters; track filter) {
    <button
      (click)="setFilter(filter)"
      class="px-4 py-2 rounded-2xl font-semibold transition-colors cursor-pointer"
      [ngClass]="{
        'bg-emerald-500 text-white': (currentFilter$ | async) === filter,
        'bg-gray-200 text-gray-700 hover:bg-gray-300': (currentFilter$ | async) !== filter
      }">
      {{ filter }}
    </button>
  }
</div>
