<div class="max-w-4xl mx-auto mt-6 p-4 flex flex-col gap-6">

  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col sm:flex-row items-center sm:items-start gap-6">

    <div class="relative shrink-0">
      <div class="w-28 h-28 bg-slate-100 rounded-full border-4 border-white shadow flex items-center justify-center">
        <mat-icon class="text-slate-400" style="font-size: 60px; width: 60px; height: 60px;">person</mat-icon>
      </div>
      <div class="absolute bottom-1 right-1 w-6 h-6 bg-emerald-500 rounded-full border-2 border-white"></div>
    </div>

    <div class="flex-1 text-center sm:text-left">
      <div class="flex items-center justify-center sm:justify-start gap-2">
        <h1 class="text-3xl font-bold text-slate-800">Unknown User</h1>
        <mat-icon class="text-blue-500">verified</mat-icon>
      </div>
      <p class="text-slate-500 font-medium mt-1">Frontend Enthusiast & Task Master</p>

      <div class="flex flex-wrap justify-center sm:justify-start gap-2 mt-4">
        <span class="px-3 py-1 bg-emerald-50 text-emerald-700 text-sm font-bold rounded-full border border-emerald-200 flex items-center gap-1">
          <mat-icon style="font-size: 16px; width: 16px; height: 16px;">admin_panel_settings</mat-icon> Admin
        </span>
        <span class="px-3 py-1 bg-amber-50 text-amber-700 text-sm font-bold rounded-full border border-amber-200 flex items-center gap-1">
          <mat-icon style="font-size: 16px; width: 16px; height: 16px;">star</mat-icon> Pro Member
        </span>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto mt-4 sm:mt-0">
      <button class="px-5 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition-colors">
        Edit Profile
      </button>
      <button class="px-5 py-2 bg-emerald-500 text-white font-bold rounded-xl hover:bg-emerald-600 transition-colors flex items-center justify-center gap-2">
        <mat-icon style="font-size: 20px; width: 20px; height: 20px;">share</mat-icon> Share
      </button>
    </div>

  </div>

  <div class="flex flex-col gap-6">

    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2">
        <mat-icon class="text-emerald-500">insights</mat-icon> Task Overview
      </h2>
      <app-total-card></app-total-card>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2">
        <mat-icon class="text-blue-500">timeline</mat-icon> Recent Activity
      </h2>
      <div class="flex flex-col items-center justify-center p-8 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50 text-slate-400">
        <mat-icon class="mb-2">auto_graph</mat-icon>
        <span class="font-medium">Detailed activity chart will appear here</span>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2">
        <mat-icon class="text-amber-500">tune</mat-icon> Quick Actions
      </h2>
      <div class="bg-slate-50 rounded-xl p-4">
        <app-settings></app-settings>
      </div>
    </div>

  </div>
