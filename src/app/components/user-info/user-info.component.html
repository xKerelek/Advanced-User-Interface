<div class="max-w-5xl mx-auto mt-6 p-4 animation-fade-in">
  <div class="relative bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden transition-all duration-300 hover:shadow-md group/card">
    <div class="h-48 bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-500 relative overflow-hidden">
      <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
      <div class="absolute bottom-0 left-0 w-48 h-48 bg-black/10 rounded-full blur-2xl translate-y-1/3 -translate-x-1/4"></div>
    </div>

    <div class="px-6 sm:px-10 pb-8 relative">
      <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end -mt-16 sm:-mt-20 mb-4 gap-4">
        <div class="relative group w-max">
          <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-full border-4 sm:border-[6px] border-white bg-slate-50 shadow-lg flex items-center justify-center overflow-hidden transition-transform duration-500 group-hover:scale-105 group-hover:rotate-3 cursor-pointer" aria-label="User Avatar">
            <mat-icon class="text-slate-300 group-hover:text-emerald-500 transition-colors duration-500 scale-150" style="font-size: 80px; width: 80px; height: 80px;">person</mat-icon>
          </div>
          <div class="absolute bottom-2 right-2 bg-emerald-500 w-6 h-6 sm:w-8 sm:h-8 rounded-full border-4 border-white flex items-center justify-center shadow-sm" aria-label="Online status">
            <span class="absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75 animate-ping"></span>
          </div>
        </div>

        <div class="flex gap-3 pb-2 w-full sm:w-auto">
          <button class="flex-1 sm:flex-none px-6 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition-all focus:outline-none focus:ring-4 focus:ring-slate-100 active:scale-95" aria-label="Edit Profile">
            Edit Profile
          </button>
          <button class="flex-1 sm:flex-none px-6 py-2.5 bg-emerald-500 text-white font-bold rounded-xl hover:bg-emerald-600 transition-all shadow-sm focus:outline-none focus:ring-4 focus:ring-emerald-200 active:scale-95 flex items-center justify-center gap-2" aria-label="Share Profile">
            <mat-icon style="font-size: 20px; width: 20px; height: 20px;">share</mat-icon>
            Share
          </button>
        </div>
      </div>

      <div class="mt-2">
        <div class="flex items-center gap-3">
          <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight" tabindex="0">Unknown User</h1>
          <mat-icon class="text-blue-500" aria-label="Verified User" style="font-size: 28px; width: 28px; height: 28px;">verified</mat-icon>
        </div>
        <p class="text-slate-500 font-medium mt-1 text-lg">Frontend Enthusiast & Task Master</p>

        <div class="flex flex-wrap gap-2 mt-5" aria-label="User Badges">
          <span class="px-4 py-1.5 bg-emerald-50 text-emerald-700 text-sm font-bold rounded-full border border-emerald-200 flex items-center gap-1 shadow-sm">
            <mat-icon style="font-size: 16px; width: 16px; height: 16px;">admin_panel_settings</mat-icon> Admin
          </span>
          <span class="px-4 py-1.5 bg-amber-50 text-amber-700 text-sm font-bold rounded-full border border-amber-200 flex items-center gap-1 shadow-sm">
            <mat-icon style="font-size: 16px; width: 16px; height: 16px;">star</mat-icon> Pro Member
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-6 mt-6">
    <div class="animation-slide-up flex flex-col gap-6" style="animation-delay: 0.1s;">

      <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100">
        <h2 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2">
          <mat-icon class="text-emerald-500">insights</mat-icon> Task Overview
        </h2>
        <app-total-card></app-total-card>
      </div>

      <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100">
        <h2 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2">
          <mat-icon class="text-blue-500">timeline</mat-icon> Recent Activity
        </h2>
        <div class="flex flex-col items-center justify-center h-40 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 bg-slate-50 transition-colors hover:bg-slate-100 hover:border-slate-300 cursor-pointer">
          <mat-icon class="mb-2 opacity-50" style="font-size: 32px; width: 32px; height: 32px;">auto_graph</mat-icon>
          <span class="font-medium">Detailed activity chart will appear here</span>
        </div>
      </div>

    </div>

    <div class="animation-slide-up" style="animation-delay: 0.2s;">
      <div class="bg-white rounded-[2rem] p-6 sm:p-8 shadow-sm border border-slate-100">
        <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
          <mat-icon class="text-amber-500">tune</mat-icon> Quick Actions
        </h2>
        <div class="bg-slate-50/50 rounded-3xl sm:p-4 border border-slate-100">
          <app-settings></app-settings>
        </div>
      </div>
    </div>
  </div>
</div>
