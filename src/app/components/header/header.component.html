<header class="bg-slate-900 p-4 relative">
  <div class="flex justify-between items-center max-w-7xl mx-auto">
    <span class="font-black text-2xl text-emerald-400 cursor-pointer" routerLink="/">
      ToDo<span class="text-white">List</span>
    </span>

    <div class="flex items-center gap-4 text-white">

      <a routerLink="/user-info" aria-label="User Profile" class="flex items-center hover:text-emerald-400 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded">
        <mat-icon style="font-size: 25px;">person</mat-icon>
      </a>

      <button
        class="md:hidden flex items-center p-2 rounded-md hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isOpen()"
        aria-controls="main-menu"
        aria-label="Open menu">
        <mat-icon>{{ isOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>

  <nav
    id="main-menu"
    aria-label="Main navigation"
    class="flex-col md:flex-row gap-4 text-white mt-4 md:mt-0 md:absolute md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2"
    [ngClass]="isOpen() ? 'flex' : 'hidden md:flex'"
  >
    <ul class="flex flex-col md:flex-row gap-4 w-full md:w-auto text-center">
      <li>
        <a routerLink="/"
           routerLinkActive="text-emerald-500 underline font-extrabold"
           [routerLinkActiveOptions]="{exact: true}"
           class="block py-2 md:py-0 hover:text-emerald-400 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded"
           (click)="isOpen.set(false)">
          Dashboard
        </a>
      </li>
      <li>
        <a routerLink="/add-todo"
           routerLinkActive="text-emerald-500 underline font-extrabold"
           class="block py-2 md:py-0 hover:text-emerald-400 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded"
           (click)="isOpen.set(false)">
          Add tasks
        </a>
      </li>
      <li>
        <a routerLink="/rick-and-morty"
           routerLinkActive="text-emerald-500 underline font-extrabold"
           class="block py-2 md:py-0 hover:text-emerald-400 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded"
           (click)="isOpen.set(false)">
          Rick and Morty
        </a>
      </li>
      <li>
        <a routerLink="/movies"
           routerLinkActive="text-emerald-500 underline font-extrabold"
           class="block py-2 md:py-0 hover:text-emerald-400 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded"
           (click)="isOpen.set(false)">
          Movies
        </a>
      </li>
    </ul>
  </nav>
</header>
